<!DOCTYPE html>

<body>

    <button id="bookmark-list-btn" class="bookmark-list-btn" title="ブックマーク">★</button>

  <main>
    <div class="container">
      <section id="search-section">
        <!-- フィルター -->
        <div class="form-group">
          <label>基準点種別</label>
          <div class="checkbox-group">
            <label><input type="checkbox" class="rank-filter" value="EL0"> 電子基準点</label>
            <label><input type="checkbox" class="rank-filter" value="TR1"> 一等三角点</label>
            <label><input type="checkbox" class="rank-filter" value="TR2"> 二等三角点</label>
            <label><input type="checkbox" class="rank-filter" value="TR3"> 三等三角点</label>
            <label><input type="checkbox" class="rank-filter" value="TR4"> 四等三角点</label>
          </div>
        </div>

        <!-- 除外オプション -->

          <label>除外オプション</label>

        </div>

          <button id="prev-btn">← 前</button>
          <span id="page-info"></span>
          <button id="next-btn">次 →</button>
        </div>

  <script type="module">
    import KijuntenDB from './src/db.js'
    import { getLabel } from './src/metadata.js'

    const db = new KijuntenDB()
    const PAGE_SIZE = 20
    let currentPage = 1
    let searchResults = []
    let allBases = []
    let prefNames = {} // 都道府県マスタ
    let searchMode = 'normal' // 'normal' or 'nearby'
    let visitedBaseIds = new Set() // 訪問済み基準点IDのセット
    let bookmarkedBaseIds = new Set() // ブックマーク済み基準点IDのセット

    await db.init()

    // 訪問履歴を読み込んで訪問済みIDを取得
    await loadVisitedBaseIds()

    // ブックマークを読み込んでブックマーク済みIDを取得
    await loadBookmarkedBaseIds()

    // 都道府県マスタをロード
    try {
      const res = await fetch('data/pref_ids.json')
      if (res.ok) {
        prefNames = await res.json()
        // プルダウンに選択肢を追加
        const prefSelect = document.getElementById('pref-select')
        Object.keys(prefNames).sort().forEach(prefId => {
          const option = document.createElement('option')
          option.value = prefId
          option.textContent = prefNames[prefId]
          prefSelect.appendChild(option)
        })
      }
    } catch (err) {
      console.warn('Failed to load pref_ids.json:', err)
    }

    // 全データを読み込み
    allBases = await db.getAllBases()

    if (allBases.length === 0) {
      document.getElementById('no-results').innerHTML = '<p style="color: #f44336;">⚠️ データがまだダウンロードされていません。<a href="/">メニュー</a>からデータをダウンロードしてください。</p>'
    }

    const nameSearchInput = document.getElementById('name-search')
    const prefSelect = document.getElementById('pref-select')
    const rankFilters = document.querySelectorAll('.rank-filter')
    const excludeSchoolCheckbox = document.getElementById('exclude-school')
    const searchBtn = document.getElementById('search-btn')
    const nearbyBtn = document.getElementById('nearby-btn')
    const clearBtn = document.getElementById('clear-btn')
    const resultsTable = document.getElementById('results-table')
    const resultsTbody = document.getElementById('results-tbody')
    const noResults = document.getElementById('no-results')
    const pagination = document.getElementById('pagination')
    const pageInfo = document.getElementById('page-info')
    const prevBtn = document.getElementById('prev-btn')
    const nextBtn = document.getElementById('next-btn')

    // 訪問履歴から訪問済み基準点IDを取得
    async function loadVisitedBaseIds() {
      try {
        const visits = await getAllVisits()
        visitedBaseIds = new Set(visits.map(v => v.baseId))
        console.log(`訪問済み基準点: ${visitedBaseIds.size}件`)
      } catch (error) {
        console.warn('訪問履歴の読み込みに失敗:', error)
      }
    }

    // ブックマークからブックマーク済み基準点IDを取得
    async function loadBookmarkedBaseIds() {
      try {
        const bookmarks = await getBookmarks()
        bookmarkedBaseIds = new Set(bookmarks.map(b => b.id))
        console.log(`ブックマーク済み基準点: ${bookmarkedBaseIds.size}件`)
      } catch (error) {
        console.warn('ブックマークの読み込みに失敗:', error)
      }
    }

    // IndexedDBから全訪問履歴を取得
    function getAllVisits() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('visitHistoryDB')

        request.onerror = () => reject(new Error('データベースを開けませんでした'))

        request.onsuccess = (event) => {
          const db = event.target.result

          if (!db.objectStoreNames.contains('visits')) {
            db.close()
            resolve([])
            return
          }

          const transaction = db.transaction(['visits'], 'readonly')
          const store = transaction.objectStore('visits')
          const getRequest = store.getAll()

          getRequest.onsuccess = () => {
            db.close()
            resolve(getRequest.result || [])
          }

          getRequest.onerror = () => {
            db.close()
            reject(new Error('データの取得に失敗しました'))
          }
        }
      })
    }

    // Haversine距離計算関数 (km単位で返す)
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371 // 地球の半径 (km)
      const dLat = (lat2 - lat1) * Math.PI / 180
      const dLon = (lon2 - lon1) * Math.PI / 180
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2)
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))
      return R * c
    }

    searchBtn.addEventListener('click', async () => {
      searchMode = 'normal'
      let rankIds = Array.from(rankFilters)
        .filter(cb => cb.checked)
        .map(cb => cb.value)
      
      // TR4が選択されている場合、EK0も自動的に含める
      if (rankIds.includes('TR4') && !rankIds.includes('EK0')) {
        rankIds.push('EK0')
      }
      // EK0が選択されている場合、TR4も自動的に含める
      if (rankIds.includes('EK0') && !rankIds.includes('TR4')) {
        rankIds.push('TR4')
      }
      
      const searchQuery = nameSearchInput.value
      const selectedPrefId = prefSelect.value
      
      const filters = {
        rankIds,
        nameQuery: searchQuery,
        nameKanaQuery: searchQuery,
        prefId: selectedPrefId
      }

      searchResults = await db.searchBases(filters)
      
      // デバッグ: 最初の数件のland_type_idを確認
      if (searchResults.length > 0) {
        console.log('検索結果サンプル（最初の5件）:')
        searchResults.slice(0, 5).forEach((base, i) => {
          console.log(`  ${i + 1}. ${base.name || base.id}: land_type_id = ${base.land_type_id} (型: ${typeof base.land_type_id})`)
        })
      }
      
      // 学校用地を除外
      if (excludeSchoolCheckbox.checked) {
        const beforeCount = searchResults.length
        searchResults = searchResults.filter(base => {
          // 数値23と文字列'23'の両方に対応
          return base.land_type_id !== '23' && base.land_type_id !== 23
        })
        console.log(`学校用地除外: ${beforeCount}件 → ${searchResults.length}件（${beforeCount - searchResults.length}件除外）`)
      }
      
      // 都道府県コード順、点種別順でソート
      sortResults()
      currentPage = 1
      displayResults()
    })

    // ソート関数：都道府県コード順 → 点種別順
    function sortResults() {
      const rankOrder = { 'EL0': 1, 'TR1': 2, 'TR2': 3, 'TR3': 4, 'TR4': 5, 'EK0': 5 }
      searchResults.sort((a, b) => {
        // 第一優先: 都道府県コード
        if (a.pref_id !== b.pref_id) {
          return a.pref_id.localeCompare(b.pref_id)
        }
        // 第二優先: 点種別
        const aRank = rankOrder[a.rank_id] || 99
        const bRank = rankOrder[b.rank_id] || 99
        return aRank - bRank
      })
    }

    nearbyBtn.addEventListener('click', async () => {
      searchMode = 'nearby'
      
      // 位置情報を取得
      if (!navigator.geolocation) {
        alert('お使いのブラウザは位置情報に対応していません。')
        return
      }

      nearbyBtn.disabled = true
      nearbyBtn.innerHTML = '&#128269;取得中...'

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude
          const userLon = position.coords.longitude

          // チェックされている点種別を取得
          let rankIds = Array.from(rankFilters)
            .filter(cb => cb.checked)
            .map(cb => cb.value)
          
          // TR4が選択されている場合、EK0も自動的に含める
          if (rankIds.includes('TR4') && !rankIds.includes('EK0')) {
            rankIds.push('EK0')
          }
          // EK0が選択されている場合、TR4も自動的に含める
          if (rankIds.includes('EK0') && !rankIds.includes('TR4')) {
            rankIds.push('TR4')
          }

          // 基準点をフィルタリング（チェックがあればその種別のみ、なければ全て）
          let targetBases = allBases
          if (rankIds.length > 0) {
            targetBases = allBases.filter(base => rankIds.includes(base.rank_id))
          }

          // 学校用地を除外
          if (excludeSchoolCheckbox.checked) {
            targetBases = targetBases.filter(base => {
              // 数値23と文字列'23'の両方に対応
              return base.land_type_id !== '23' && base.land_type_id !== 23
            })
          }

          // 距離を計算して追加
          searchResults = targetBases.map(base => {
            const distance = calcDistance(userLat, userLon, base.lat, base.lon)
            return { ...base, distance }
          })

          // 距離でソート（昇順）
          searchResults.sort((a, b) => a.distance - b.distance)

          // 上位20件のみ取得
          searchResults = searchResults.slice(0, 20)

          currentPage = 1
          displayResults()

          nearbyBtn.disabled = false
          nearbyBtn.innerHTML = '&#128269;近傍20点'
        },
        (error) => {
          let message = '位置情報の取得に失敗しました。'
          if (error.code === error.PERMISSION_DENIED) {
            message = '位置情報の使用が許可されていません。ブラウザの設定を確認してください。'
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            message = '位置情報が利用できません。'
          } else if (error.code === error.TIMEOUT) {
            message = '位置情報の取得がタイムアウトしました。'
          }
          alert(message)
          nearbyBtn.disabled = false
          nearbyBtn.innerHTML = '&#128269;近傍20点'
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      )
    })

    clearBtn.addEventListener('click', () => {
      searchMode = 'normal'
      rankFilters.forEach(cb => cb.checked = false)
      excludeSchoolCheckbox.checked = false
      nameSearchInput.value = ''
      prefSelect.value = ''
      searchResults = []
      currentPage = 1
      resultsTable.style.display = 'none'
      document.getElementById('results-header').style.display = 'none'
      noResults.style.display = 'block'
      pagination.style.display = 'none'
    })

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--
        displayResults()
      }
    })

    nextBtn.addEventListener('click', () => {
      const maxPage = Math.ceil(searchResults.length / PAGE_SIZE)
      if (currentPage < maxPage) {
        currentPage++
        displayResults()
      }
    })

    function displayResults() {
      const resultsHeader = document.getElementById('results-header')
      const resultsCount = document.getElementById('results-count')
      
      if (searchResults.length === 0) {
        resultsTable.style.display = 'none'
        resultsHeader.style.display = 'none'
        noResults.style.display = 'block'
        pagination.style.display = 'none'
        return
      }

      const maxPage = Math.ceil(searchResults.length / PAGE_SIZE)
      const start = (currentPage - 1) * PAGE_SIZE
      const end = start + PAGE_SIZE
      const pageResults = searchResults.slice(start, end)
      
      // 検索結果数を表示
      resultsCount.textContent = `検索結果: ${searchResults.length}件`
      resultsHeader.style.display = 'flex'

      // テーブルヘッダーを動的に変更
      const tableHead = resultsTable.querySelector('thead tr')
      if (searchMode === 'nearby') {
        tableHead.innerHTML = `
          <th>種別</th>
          <th>点名</th>
          <th>距離</th>
          <th>都道府県</th>
          <th>詳細</th>
        `
      } else {
        tableHead.innerHTML = `
          <th>種別</th>
          <th>点名</th>
          <th>基準点コード</th>
          <th>都道府県</th>
          <th>詳細</th>
        `
      }

      resultsTbody.innerHTML = pageResults.map(base => {
        const prefName = prefNames[base.pref_id] || '-'
        // 種別を短縮表示
        const rankLabel = getLabel('rank_ids', base.rank_id)
        let shortRank = rankLabel
        if (rankLabel.includes('電子')) shortRank = '電子'
        else if (rankLabel.includes('一等')) shortRank = '一等'
        else if (rankLabel.includes('二等')) shortRank = '二等'
        else if (rankLabel.includes('三等')) shortRank = '三等'
        else if (rankLabel.includes('四等')) shortRank = '四等'
        
        // nearbyモードの場合は距離を計算して表示
        if (searchMode === 'nearby' && base.distance !== undefined) {
          let distanceText = ''
          if (base.distance < 1) {
            distanceText = `${Math.round(base.distance * 1000)}m`
          } else {
            distanceText = `${base.distance.toFixed(2)}km`
          }
          
          // 訪問済み・ブックマーク済みハイライト（訪問済み優先）
          const classes = []
          if (visitedBaseIds.has(base.id)) {
            classes.push('visited-row')
          } else if (bookmarkedBaseIds.has(base.id)) {
            classes.push('bookmarked-row')
          }
          const classAttr = classes.length > 0 ? ` class="${classes.join(' ')}"` : ''
          
          return `
          <tr${classAttr}>
            <td>${shortRank}</td>
            <td>${base.name || '-'}</td>
            <td>${distanceText}</td>
            <td>${prefName}</td>
            <td><a href="detail.html?id=${base.id}" class="detail-btn" title="詳細を表示">📖</a></td>
          </tr>
        `
        } else {
          // 訪問済み・ブックマーク済みハイライト（訪問済み優先）
          const classes = []
          if (visitedBaseIds.has(base.id)) {
            classes.push('visited-row')
          } else if (bookmarkedBaseIds.has(base.id)) {
            classes.push('bookmarked-row')
          }
          const classAttr = classes.length > 0 ? ` class="${classes.join(' ')}"` : ''
          
          return `
          <tr${classAttr}>
            <td>${shortRank}</td>
            <td>${base.name || '-'}</td>
            <td><code style="font-size: 0.75rem;">${base.id}</code></td>
            <td>${prefName}</td>
            <td><a href="detail.html?id=${base.id}" class="detail-btn" title="詳細を表示">📖</a></td>
          </tr>
        `
        }
      }).join('')

      pageInfo.textContent = `${currentPage}/${maxPage}（全${searchResults.length}件）`

      resultsTable.style.display = 'table'
      noResults.style.display = 'none'
      pagination.style.display = 'flex'

      prevBtn.disabled = currentPage === 1
      nextBtn.disabled = currentPage === maxPage
    }

    // ===== ブックマーク機能 =====
    const bookmarkListBtn = document.getElementById('bookmark-list-btn')

    // ブックマークポップアップを表示
    bookmarkListBtn.addEventListener('click', async () => {
      const bookmarks = await getBookmarks()
      showBookmarkPopup(bookmarks)
    })

    // ブックマークポップアップ表示
    function showBookmarkPopup(bookmarks) {
      // オーバーレイを作成
      const overlay = document.createElement('div')
      overlay.className = 'bookmark-overlay show'
      overlay.id = 'bookmark-overlay'
      overlay.onclick = closeBookmarkPopup
      document.body.appendChild(overlay)

      // ポップアップHTML作成
      let popupHTML = `
        <div class="bookmark-popup show" id="bookmark-popup">
          <div class="bookmark-popup-header">
            <h3>⭐ ブックマーク</h3>
            <button class="bookmark-popup-close" onclick="closeBookmarkPopup()">×</button>
          </div>
          <div class="bookmark-popup-content" id="bookmark-popup-content">
      `
      
      if (bookmarks.length === 0) {
        popupHTML += '<div class="bookmark-empty">ブックマークはまだありません</div>'
      } else {
        bookmarks.forEach((bookmark) => {
          const rankLabel = getLabel('rank_ids', bookmark.rank_id)
          let shortRank = rankLabel
          if (rankLabel.includes('電子')) shortRank = '電子'
          else if (rankLabel.includes('一等')) shortRank = '一等'
          else if (rankLabel.includes('二等')) shortRank = '二等'
          else if (rankLabel.includes('三等')) shortRank = '三等'
          else if (rankLabel.includes('四等')) shortRank = '四等'
          
          popupHTML += `
            <div class="bookmark-item" data-id="${bookmark.id}">
              <button class="bookmark-item-remove" data-bookmark-id="${bookmark.id}" onclick="removeBookmarkItem(event, '${bookmark.id}')">×</button>
              <div class="bookmark-item-left">
                <div class="bookmark-item-rank">${shortRank}</div>
                <div class="bookmark-item-name">${bookmark.name || '名称不明'}</div>
              </div>
            </div>
          `
        })
      }
      
      popupHTML += '</div></div>'
      
      // 既存のポップアップがあれば削除
      const existingPopup = document.getElementById('bookmark-popup')
      if (existingPopup) {
        existingPopup.remove()
      }
      
      // ポップアップを追加
      document.body.insertAdjacentHTML('beforeend', popupHTML)
      
      // クリックイベント追加
      document.querySelectorAll('.bookmark-item').forEach(item => {
        item.addEventListener('click', () => {
          const baseId = item.dataset.id
          window.location.href = `detail.html?id=${baseId}`
        })
      })
    }

    // ブックマークポップアップを閉じる
    window.closeBookmarkPopup = function() {
      const popup = document.getElementById('bookmark-popup')
      const overlay = document.getElementById('bookmark-overlay')
      
      if (popup) {
        popup.classList.remove('show')
        setTimeout(() => popup.remove(), 300)
      }
      
      if (overlay) {
        overlay.classList.remove('show')
        setTimeout(() => overlay.remove(), 300)
      }
    }

    // ブックマークアイテムを削除
    window.removeBookmarkItem = async function(event, baseId) {
      event.stopPropagation() // 親要素のクリックイベントを防ぐ
      
      if (!confirm('ブックマークから解除しますか？')) {
        return
      }
      
      try {
        const bookmarks = await getBookmarks()
        const newBookmarks = bookmarks.filter(b => b.id !== baseId)
        await saveBookmarks(newBookmarks)
        
        // リストを再表示
        closeBookmarkPopup()
        setTimeout(async () => {
          const updatedBookmarks = await getBookmarks()
          bookmarkedBaseIds = new Set(updatedBookmarks.map(b => b.id))
          showBookmarkPopup(updatedBookmarks)
          displayResults() // 検索結果も更新
        }, 200)
      } catch (error) {
        console.error('Bookmark removal failed:', error)
        alert('ブックマークの解除に失敗しました')
      }
    }

    // ブックマーク取得
    function getBookmarks() {
      return new Promise((resolve) => {
        const request = indexedDB.open('bookmarkDB', 1)
        
        request.onerror = () => resolve([])
        
        request.onsuccess = (event) => {
          const db = event.target.result
          
          if (!db.objectStoreNames.contains('bookmarks')) {
            db.close()
            resolve([])
            return
          }
          
          const transaction = db.transaction(['bookmarks'], 'readonly')
          const store = transaction.objectStore('bookmarks')
          const getRequest = store.get('list')
          
          getRequest.onsuccess = () => {
            db.close()
            resolve(getRequest.result?.bookmarks || [])
          }
          
          getRequest.onerror = () => {
            db.close()
            resolve([])
          }
        }
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result
          if (!db.objectStoreNames.contains('bookmarks')) {
            db.createObjectStore('bookmarks', { keyPath: 'key' })
          }
        }
      })
    }

    // ブックマーク保存
    function saveBookmarks(bookmarks) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('bookmarkDB', 1)
        
        request.onerror = () => reject(new Error('データベースを開けませんでした'))
        
        request.onsuccess = (event) => {
          const db = event.target.result
          const transaction = db.transaction(['bookmarks'], 'readwrite')
          const store = transaction.objectStore('bookmarks')
          
          const putRequest = store.put({ key: 'list', bookmarks })
          
          putRequest.onsuccess = () => {
            db.close()
            resolve()
          }
          
          putRequest.onerror = () => {
            db.close()
            reject(new Error('保存に失敗しました'))
          }
        }
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result
          if (!db.objectStoreNames.contains('bookmarks')) {
            db.createObjectStore('bookmarks', { keyPath: 'key' })
          }
        }
      })
    }
  </script>
</body>
</html>
